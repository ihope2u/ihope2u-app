<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071b3a">
<title>IHope2U - Your Hope, Our Support</title>

<!-- Monetag SDK: Existing Integration -->
<script src="https://libtl.com/sdk.js"
data-zone="12177258"
data-sdk="show_12177258"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f2f6fc;
 color:#17243b;
}
header{
 background:linear-gradient(135deg,#071b3a,#14518c);
 color:white;
 padding:25px 20px 35px;
 border-radius:0 0 28px 28px;
}
.logo{font-size:29px;font-weight:bold}
.logo span{color:#28d1e1}
.hero{margin-top:25px}
.hero h1{font-size:29px;margin:0 0 12px}
.hero p{
 color:#dcecff;font-size:15px;
 line-height:1.7;margin:5px 0;
}
main{max-width:950px;margin:auto;padding:20px 16px}
.title{font-size:22px;margin:12px 0 20px}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:13px;
}
.card{
 width:100%;text-align:left;background:white;
 padding:18px 15px;min-height:145px;
 border-radius:19px;border:1px solid #e1e9f4;
 box-shadow:0 5px 16px #102d5010;
 cursor:pointer;color:#17243b;
 font-family:inherit;
 transition:transform .2s,box-shadow .2s;
}
.card:hover{
 transform:translateY(-4px);
 box-shadow:0 9px 20px #102d5020;
}
.card:active{background:#e5faff}
.card:focus-visible{
 outline:3px solid #28d1e1;outline-offset:3px;
}
.icon{font-size:32px;margin-bottom:12px}
.card h3{font-size:17px;margin:0 0 7px}
.card p{
 font-size:13px;color:#718096;
 margin:0;line-height:1.5;
}
.notice{
 margin-top:20px;background:#e4faff;
 border:1px solid #b8edf4;border-radius:16px;
 padding:17px;font-size:14px;line-height:1.7;
}
.page{
 display:none;background:white;padding:22px;
 border-radius:18px;min-height:280px;
 box-shadow:0 5px 18px #102d5010;
}
.page h2{color:#14518c}
.page p{line-height:1.8;color:#58677c}
.action{
 display:inline-block;background:#14518c;
 color:white;text-decoration:none;
 padding:12px 18px;border-radius:10px;
 margin:10px 5px 10px 0;font-size:14px;
 border:0;cursor:pointer;
}
.back{background:#e7f0fb;color:#14518c}
.small-note{
 background:#f0f6ff;border:1px solid #dce8f8;
 padding:13px;border-radius:12px;
 font-size:13px;line-height:1.7;
 margin-top:15px;color:#52647c;
}
footer{
 text-align:center;padding:25px 15px;
 color:#778399;font-size:13px;line-height:1.8;
}
@media(min-width:650px){
 .grid{grid-template-columns:repeat(4,1fr)}
 header{padding-left:max(25px,calc((100% - 910px)/2))}
}
@media(max-width:360px){
 .card{padding:14px 11px}
 .card h3{font-size:15px}
}
</style>
</head>

<body>

<header>
 <div class="logo">IHope<span>2U</span></div>
 <div class="hero">
  <h1>Welcome to IHope2U</h1>
  <p>Your Hope, Our Support!</p>
  <p>Learn, Explore, Stay Updated and Grow With Us.</p>
 </div>
</header>

<main>

<!-- HOME: ALL 8 ORIGINAL BUTTONS RETAINED -->
<div id="home">
 <h2 class="title">🌟 Explore IHope2U</h2>

 <div class="grid">

  <button class="card" onclick="openPage('Home')">
   <div class="icon">🏠</div>
   <h3>Home</h3>
   <p>Your dashboard and latest updates.</p>
  </button>

  <button class="card" onclick="openPage('News')">
   <div class="icon">📰</div>
   <h3>News</h3>
   <p>Latest news and useful information.</p>
  </button>

  <button class="card" onclick="openPage('Study & Exam Zone')">
   <div class="icon">🎓</div>
   <h3>Study & Exam Zone</h3>
   <p>Notes, MCQ, Mock Tests and exam preparation.</p>
  </button>

  <button class="card" onclick="openPage('Blogs')">
   <div class="icon">✍️</div>
   <h3>Blogs</h3>
   <p>Articles, ideas and useful stories.</p>
  </button>

  <button class="card" onclick="openPage('Earn & Rewards')">
   <div class="icon">🎁</div>
   <h3>Earn & Rewards</h3>
   <p>Online earning and reward information.</p>
  </button>

  <button class="card" onclick="openPage('Entertainment')">
   <div class="icon">🎬</div>
   <h3>Entertainment</h3>
   <p>Fun content and discoveries.</p>
  </button>

  <button class="card" onclick="openPage('Refer & Earn')">
   <div class="icon">🤝</div>
   <h3>Refer & Earn</h3>
   <p>Share IHope2U with your friends.</p>
  </button>

  <button class="card" onclick="openPage('My Profile')">
   <div class="icon">👤</div>
   <h3>My Profile</h3>
   <p>About IHope2U and contact information.</p>
  </button>

 </div>

 <div class="notice">
  <b>❤️ Welcome to IHope2U!</b><br>
  Your Hope, Our Support!<br>
  Learn • Explore • Grow
 </div>
</div>

<!-- COMMON SECTION -->
<div id="section" class="page">
 <h2 id="pageTitle"></h2>
 <p id="pageText"></p>
 <div id="pageExtra"></div>
 <button class="action back" onclick="goHome()">
  ⬅ Back to Home
 </button>
</div>

</main>

<footer>
 © 2026 IHope2U. All Rights Reserved.<br>
 Learn • Explore • Grow
</footer>

<script>
const BLOG_URL="https://ihope2you.blogspot.com";

const descriptions={
 "Home":{
  text:"Welcome to IHope2U! Explore useful information, education, news and entertainment."
 },
 "News":{
  text:"Stay updated with the latest news, important updates and useful information.",
  label:"News",action:"Read Latest News"
 },
 "Blogs":{
  text:"Read informative articles, useful tips, knowledge and interesting stories.",
  label:"Blogs",action:"Read All Blogs"
 },
 "Earn & Rewards":{
  text:"Explore online earning information, digital opportunities and reward-related updates. Always verify offers before participating.",
  label:"Earn & Rewards",action:"Explore Earning Articles"
 },
 "Entertainment":{
  text:"Discover interesting videos, entertainment articles and trending content.",
  label:"Entertainment",action:"Explore Entertainment"
 },
 "Refer & Earn":{
  text:"Enjoy IHope2U? Share our website with your friends and family. Help others discover useful information."
 },
 "My Profile":{
  text:"IHope2U is an informational platform covering education, news, technology, knowledge and entertainment."
 }
};

/* STUDY & EXAM ZONE CATEGORIES */
const studyCategories=[
 {
  icon:"🏫",
  title:"School Education",
  desc:"Class 6 to 12 • MP Board • CBSE",
  label:"School Education"
 },
 {
  icon:"🎓",
  title:"College Education",
  desc:"College study material and learning",
  label:"College Education"
 },
 {
  icon:"💼",
  title:"Government Jobs",
  desc:"MPESB • MPPSC • SSC • Railway",
  label:"Government Jobs"
 },
 {
  icon:"👨‍🏫",
  title:"Teaching Exams",
  desc:"MP TET • CTET • UGC NET",
  label:"Teaching Exams"
 },
 {
  icon:"📚",
  title:"Notes & PDF",
  desc:"Study notes and downloadable material",
  label:"Notes PDF"
 },
 {
  icon:"📝",
  title:"MCQ Practice",
  desc:"Practice questions and answers",
  label:"MCQ Practice"
 }
];

function openPage(name){
 document.getElementById("home").style.display="none";
 document.getElementById("section").style.display="block";

 document.getElementById("pageTitle").textContent=name;

 const pageText=document.getElementById("pageText");
 const extra=document.getElementById("pageExtra");
 extra.innerHTML="";

 if(name==="Study & Exam Zone"){
  pageText.textContent=
   "Choose your class, subject or examination and explore useful study material.";

  studyCategories.forEach(item=>{
   const card=document.createElement("div");
   card.style.cssText=
    "background:#f5f8fd;border:1px solid #e1e9f4;padding:15px;margin:12px 0;border-radius:13px";

   const heading=document.createElement("h3");
   heading.textContent=item.icon+" "+item.title;
   heading.style.margin="0 0 7px";
   heading.style.color="#14518c";

   const desc=document.createElement("p");
   desc.textContent=item.desc;
   desc.style.margin="0 0 8px";

   const link=document.createElement("a");
   link.className="action";
   link.textContent="Open "+item.title;
   link.href=BLOG_URL+"/search/label/"+encodeURIComponent(item.label);
   link.target="_blank";
   link.rel="noopener noreferrer";

   card.appendChild(heading);
   card.appendChild(desc);
   card.appendChild(link);
   extra.appendChild(card);
  });

  addStudyFeature(
   extra,
   "⏱️ Online Mock Test",
   "Timed online tests with automatic result and score.",
   "coming"
  );

  addStudyFeature(
   extra,
   "🏆 Result & Ranking",
   "View test results, scores and student rankings.",
   "coming"
  );

  const note=document.createElement("div");
  note.className="small-note";
  note.textContent=
   "Online Mock Test, Result and Ranking system will be activated after the secure database and Admin Panel are connected.";
  extra.appendChild(note);

 }else{
  const data=descriptions[name];
  if(!data)return;

  pageText.textContent=data.text;

  if(data.label){
   const link=document.createElement("a");
   link.className="action";
   link.textContent=data.action;
   link.href=BLOG_URL+"/search/label/"+encodeURIComponent(data.label);
   link.target="_blank";
   link.rel="noopener noreferrer";
   extra.appendChild(link);
  }
 }

 if(name==="Refer & Earn"){
  const btn=document.createElement("button");
  btn.className="action";
  btn.textContent="Share IHope2U";
  btn.onclick=shareWebsite;
  extra.appendChild(btn);

  const link=document.createElement("a");
  link.className="action";
  link.textContent="Monetag Referral Information";
  link.href=
   BLOG_URL+"/2026/11/monetag-referral-program-5-percent-commission.html";
  link.target="_blank";
  link.rel="noopener noreferrer";
  extra.appendChild(link);
 }

 if(name==="My Profile"){
  const link=document.createElement("a");
  link.className="action";
  link.textContent="Contact / About";
  link.href=BLOG_URL+"/p/contact.html";
  link.target="_blank";
  link.rel="noopener noreferrer";
  extra.appendChild(link);
 }

 window.scrollTo(0,0);
}

function addStudyFeature(parent,title,description,type){
 const card=document.createElement("div");
 card.style.cssText=
  "background:#f5f8fd;border:1px solid #e1e9f4;padding:15px;margin:12px 0;border-radius:13px";

 const heading=document.createElement("h3");
 heading.textContent=title;
 heading.style.color="#14518c";

 const desc=document.createElement("p");
 desc.textContent=description;

 const button=document.createElement("button");
 button.className="action";
 button.textContent="Coming Soon";
 button.style.background="#718096";
 button.onclick=function(){
  alert("This feature will be activated after the Admin Panel and database are connected.");
 };

 card.appendChild(heading);
 card.appendChild(desc);
 card.appendChild(button);
 parent.appendChild(card);
}

function goHome(){
 document.getElementById("section").style.display="none";
 document.getElementById("home").style.display="block";
 window.scrollTo(0,0);
}

async function shareWebsite(){
 const shareData={
  title:"IHope2U",
  text:"Visit IHope2U - Your Hope, Our Support!",
  url:WEB_APP_URL
 };

 try{
  if(navigator.share){
   await navigator.share(shareData);
  }else if(navigator.clipboard){
   await navigator.clipboard.writeText(shareData.url);
   alert("Website link copied successfully!");
  }else{
   prompt("Copy your website link:",shareData.url);
  }
 }catch(error){
  if(error.name!=="AbortError"){
   prompt("Copy your website link:",shareData.url);
  }
 }
}

const WEB_APP_URL="https://ihope2u.github.io/ihope2u-app/";

/* MONETAG IN-APP INTERSTITIAL: EXISTING SETTINGS */
window.addEventListener("load",function(){
 setTimeout(function(){
  try{
   if(typeof show_12177258==="function"){
    show_12177258({
     type:"inApp",
     inAppSettings:{
      frequency:2,
      capping:0.1,
      interval:30,
      timeout:5,
      everyPage:false
     }
    });
   }
  }catch(error){
   console.log("Monetag ad unavailable:",error);
  }
 },5000);
});
</script>

</body>
</html>
